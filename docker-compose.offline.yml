# =============================================================================
# Docker Compose - SGIK POS (Producción OFFLINE)
# 
# IMPORTANTE: Este archivo NO hace build, usa imágenes pre-construidas.
# Primero debes cargar las imágenes con: install-offline.bat
#
# Uso: docker compose -f docker-compose.offline.yml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Base de datos MySQL
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: sgik-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: sgik
      MYSQL_USER: ${MYSQL_USER:-sgik_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sgik_pass}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sgik-network

  # ---------------------------------------------------------------------------
  # Backend Spring Boot (imagen pre-construida)
  # ---------------------------------------------------------------------------
  backend:
    image: sgik-backend:1.0
    container_name: sgik-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sgik?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-sgik_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-sgik_pass}
      SECURITY_JWT_SECRET: ${JWT_SECRET:-QXJZUVZ2dGloc1ZqV2tGRmhhbG1uT3Bxd1JUS1ZXd2hha1ZVY0ZySmd2T1NUR1JYVEVPU0pJQ0VaWg==}
      SECURITY_JWT_EXPIRATION_MS: ${JWT_EXPIRATION:-28800000}
    ports:
      - "8080:8080"
    networks:
      - sgik-network

  # ---------------------------------------------------------------------------
  # Frontend Next.js (imagen pre-construida)
  # ---------------------------------------------------------------------------
  frontend:
    image: sgik-frontend:1.0
    container_name: sgik-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks:
      - sgik-network

# =============================================================================
# Volúmenes persistentes
# =============================================================================
volumes:
  mysql_data:
    driver: local

# =============================================================================
# Red interna
# =============================================================================
networks:
  sgik-network:
    driver: bridge
