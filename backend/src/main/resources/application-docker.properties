# =============================================================================
# Configuración para Docker - SGIK POS
# Se activa automáticamente cuando SPRING_PROFILES_ACTIVE=docker
# =============================================================================

# Base de datos MySQL (dentro de Docker network)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/sgik?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sgik_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sgik_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# Pool de conexiones Hikari
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Servidor
server.port=8080

# CORS - Permitir todas las origenes en Docker (el frontend está en la misma red)
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.exposed-headers=Authorization

# JWT
security.jwt.secret=${SECURITY_JWT_SECRET:QXJZUVZ2dGloc1ZqV2tGRmhhbG1uT3Bxd1JUS1ZXd2hha1ZVY0ZySmd2T1NUR1JYVEVPU0pJQ0VaWg==}
security.jwt.expiration-ms=${SECURITY_JWT_EXPIRATION_MS:28800000}

# Logging
logging.level.com.kiosk.pos=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Actuator para health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Desactivar inicialización SQL (usamos scripts de Docker)
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

