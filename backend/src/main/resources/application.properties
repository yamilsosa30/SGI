# Server Configuration
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/sgik?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (disabled)
spring.h2.console.enabled=false

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.exposed-headers=Authorization

# JWT (DEV) - Cambiar en prod. Debe ser Base64 y >= 256 bits
security.jwt.secret=QXJZUVZ2dGloc1ZqV2tGRmhhbG1uT3Bxd1JUS1ZXd2hha1ZVY0ZySmd2T1NUR1JYVEVPU0pJQ0VaWg==
security.jwt.expiration-ms=28800000
 
 # SQL init disabled (usaremos scripts manuales en database/)
 spring.jpa.defer-datasource-initialization=false
 spring.sql.init.mode=never

# Perfil prod ya contiene su propia configuración MySQL en application-prod.properties
