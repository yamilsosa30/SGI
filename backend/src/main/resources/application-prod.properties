# Configuración de Producción - Sistema POS Kioscos
# Activar con: mvn spring-boot:run -Dspring.profiles.active=prod

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sgik?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate para producción
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# Pool de conexiones optimizado
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Servidor
server.port=8080
server.servlet.context-path=/api

# CORS para producción (ajustar según dominio real)
cors.allowed-origins=https://tu-dominio.com,https://www.tu-dominio.com
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*

# Logging optimizado
logging.level.com.kiosk.pos=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Actuator para monitoreo
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
